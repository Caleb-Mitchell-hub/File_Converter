version: "3.9"

services:
  api:
    build:
      # 重要：context 设为 .. （仓库根），
      # 这样 Dockerfile 可以同时访问 api/ 和 doc_converter/
      context: ..
      dockerfile: api/Dockerfile
    container_name: doc-converter-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - LOG_DIR=/app/logs
      - MAX_UPLOAD_SIZE_MB=200
      - MAX_BATCH_FILES=100
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 可选：nginx 反向代理（用 --profile with-nginx 启动）
  nginx:
    image: nginx:alpine
    container_name: doc-converter-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - with-nginx
