
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件转换平台 · 登录页设计预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- 全屏渐变背景 + 光晕 ---------- */
  .page {
    height: 100%;
    display: flex;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 45%, #06b6d4 100%);
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .45;
    pointer-events: none;
  }
  .glow-1 { width: 420px; height: 420px; background: #a78bfa; top: -120px; left: 8%; }
  .glow-2 { width: 380px; height: 380px; background: #22d3ee; bottom: -100px; right: 30%; }
  .glow-3 { width: 300px; height: 300px; background: #f472b6; bottom: 12%; left: 40%; }

  /* ---------- 左：品牌区 ---------- */
  .brand {
    flex: 1.1;
    color: #fff;
    padding: 80px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  .brand-logo {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  .brand-logo-icon {
    width: 56px; height: 56px;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    font-size: 30px;
  }
  .brand h1 { font-size: 40px; font-weight: 700; letter-spacing: 1px; }
  .brand-sub { font-size: 16px; opacity: .85; margin-bottom: 56px; }

  .features { display: flex; flex-direction: column; gap: 22px; }
  .feature { display: flex; align-items: center; gap: 16px; }
  .feature-icon {
    width: 44px; height: 44px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    backdrop-filter: blur(6px);
    flex-shrink: 0;
  }
  .feature strong { display: block; font-size: 16px; font-weight: 600; }
  .feature span { font-size: 13px; opacity: .78; }

  /* ---------- 右：表单区 ---------- */
  .form-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 32px;
    position: relative;
    z-index: 1;
  }
  .card {
    width: 420px;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255,255,255,.55);
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(15, 23, 42, .25);
    padding: 36px 36px 28px;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 26px; }
  .tab {
    flex: 1;
    padding: 9px 0;
    text-align: center;
    border-radius: 10px;
    font-size: 15px;
    color: #64748b;
    cursor: pointer;
    border: none;
    background: transparent;
    transition: all .18s;
  }
  .tab.active {
    background: #fff;
    color: #4f46e5;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(79, 70, 229, .18);
  }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; color: #475569; margin-bottom: 7px; font-weight: 500; }
  .input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid rgba(100, 116, 139, .25);
    border-radius: 10px;
    font-size: 14px;
    background: rgba(255,255,255,.85);
    outline: none;
    transition: border .15s, box-shadow .15s;
  }
  .input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
  .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .checkbox { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #475569; cursor: pointer; }
  .checkbox input { width: 15px; height: 15px; accent-color: #6366f1; cursor: pointer; }
  .link-forgot { font-size: 13px; color: #6366f1; text-decoration: none; }

  .btn {
    width: 100%;
    padding: 12px 0;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    cursor: pointer;
    transition: transform .12s, box-shadow .2s;
    box-shadow: 0 8px 20px rgba(99, 102, 241, .35);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(99,102,241,.42); }
  .btn:active { transform: translateY(0); }

  .copyright {
    margin-top: 20px;
    font-size: 12px;
    color: rgba(255,255,255,.75);
    text-align: center;
  }

  /* 注册表单默认隐藏 */
  #regForm { display: none; }
</style>
</head>
<body>
<div class="page">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <!-- 左：品牌区 -->
  <div class="brand">
    <div class="brand-logo">
      <div class="brand-logo-icon"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
      <div>
        <h1>文件转换平台</h1>
        <div class="brand-sub">企业级文档格式转换服务</div>
      </div>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></div>
        <div>
          <strong>多格式互转</strong>
          <span>Excel / Word / PDF / 图片 13 种转换方向</span>
        </div>
      </div>
      <div class="feature">
        <div class="feature-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg></div>
        <div>
          <strong>三引擎 OCR</strong>
          <span>Tesseract · Qwen-VL · OpenCV 混合识别</span>
        </div>
      </div>
      <div class="feature">
        <div class="feature-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
        <div>
          <strong>批量转换</strong>
          <span>多文件后台任务，进度实时追踪</span>
        </div>
      </div>
      <div class="feature">
        <div class="feature-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <div>
          <strong>安全隔离</strong>
          <span>用户数据隔离，任务持久化不丢失</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 右：表单区 -->
  <div class="form-side">
    <div class="card">
      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchTab('login')">登 录</button>
        <button class="tab" id="tabReg" onclick="switchTab('reg')">注 册</button>
      </div>

      <!-- 登录 -->
      <form id="loginForm" onsubmit="event.preventDefault(); alert('登录成功（演示）');">
        <div class="field">
          <label>用户名</label>
          <input class="input" value="admin" placeholder="请输入用户名">
        </div>
        <div class="field">
          <label>密码</label>
          <input class="input" type="password" value="admin123" placeholder="请输入密码">
        </div>
        <div class="row-between">
          <label class="checkbox"><input type="checkbox" checked> 记住我</label>
          <a class="link-forgot" href="javascript:void(0)">忘记密码？</a>
        </div>
        <button class="btn" type="submit">登 录</button>
      </form>

      <!-- 注册 -->
      <form id="regForm" onsubmit="event.preventDefault(); alert('注册成功（演示）');">
        <div class="field">
          <label>用户名（3-32 位）</label>
          <input class="input" placeholder="请输入用户名">
        </div>
        <div class="field">
          <label>昵称（可选）</label>
          <input class="input" placeholder="请输入昵称">
        </div>
        <div class="field">
          <label>密码（至少 6 位）</label>
          <input class="input" type="password" placeholder="请输入密码">
        </div>
        <div class="field">
          <label>确认密码</label>
          <input class="input" type="password" placeholder="请再次输入密码">
        </div>
        <button class="btn" type="submit">注 册</button>
      </form>
    </div>

    <div class="copyright">© 2026 File Converter · v1.0.0 · All rights reserved</div>
  </div>
</div>

<script>
function switchTab(name) {
  document.getElementById('tabLogin').classList.toggle('active', name === 'login');
  document.getElementById('tabReg').classList.toggle('active', name === 'reg');
  document.getElementById('loginForm').style.display = name === 'login' ? 'block' : 'none';
  document.getElementById('regForm').style.display = name === 'reg' ? 'block' : 'none';
}
</script>
</body>
</html>
